aid: zafran-security
name: Zafran Security
description: >-
  Zafran Security is an AI-native threat exposure management (CTEM) platform for
  security teams buried in vulnerabilities and manual remediation work. It brings
  vulnerability findings together across an organization's existing scanners and
  tools to create a unified view of exposure across the hybrid enterprise, then
  determines actual exploitability by analyzing runtime presence, internet
  reachability, and existing compensating controls. Zafran maps vulnerabilities to
  controls the team already owns to mitigate risk before patching, and its RemOps
  capability uses generative AI to consolidate overlapping CVEs into a clear
  get-well plan routed to the right owners through existing ticketing platforms.
  The platform is delivered as a SaaS product accessed at api.zafran.io behind
  Descope-based authentication with API-key access for integrations (Axonius,
  Palo Alto Cortex XSOAR); it does not publish a public developer portal or
  OpenAPI. Zafran is backed by Menlo Ventures.
